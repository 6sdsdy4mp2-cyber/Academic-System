<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fail = m => { throw new Error(m); };
const on = (sel, ev, fn) => $(sel)[ev] = async e => { try { await fn(e); } catch (x) { if (x && x.message) alert(x.message); } };
const now = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

/* ── 資料層：IndexedDB（資料存在這部電腦的瀏覽器內） ── */
const ADMIN_USER = 'admin', ADMIN_HASH = 'df316e893315157c636a57f457e7f0daf8a78f443ec4a773f853ec7e93bce779';
const H = async s => {
  if (!window.crypto || !crypto.subtle) fail('此瀏覽器不支援加密功能，請改用 Chrome、Edge 或 Firefox 開啟。');
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('darcy:' + s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
};
let idb;
const openDb = () => new Promise((ok, no) => {
  const r = indexedDB.open('darcy-school', 1);
  r.onupgradeneeded = () => { const d = r.result; ['teachers', 'nodes', 'books'].forEach(n => d.createObjectStore(n, {keyPath: 'id', autoIncrement: true})); d.createObjectStore('ann'); };
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const tx = (s, m, f) => new Promise((ok, no) => { const t = idb.transaction(s, m), q = f(t.objectStore(s)); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); });
const all = s => tx(s, 'readonly', st => st.getAll());
const get = (s, k) => tx(s, 'readonly', st => st.get(k));
const put = (s, v, k) => tx(s, 'readwrite', st => st.put(v, k));
const del = (s, k) => tx(s, 'readwrite', st => st.delete(k));

let ME = {}, cwd = null, sel = null, items = [], NS = [];

/* ── 登入 ── */
$('#lf').onsubmit = async e => {
  e.preventDefault();
  try {
    const u = $('#u').value.trim(), p = await H($('#p').value); let s = null;
    if (u === ADMIN_USER && p === ADMIN_HASH) s = {role: 'admin', name: '管理員'};
    else { const t = (await all('teachers')).find(x => x.username === u); if (t && t.pw === p) s = {role: 'teacher', uid: t.id, name: t.name}; }
    if (!s) { $('#err').textContent = '帳號或密碼錯誤，請再試一次。'; return; }
    sessionStorage.s = JSON.stringify(s); start(s);
  } catch (x) { $('#err').textContent = x.message || '登入失敗'; }
};
function start(s) {
  ME = {admin: s.role === 'admin', name: s.name, uid: s.uid};
  document.body.classList.add('in');
  $('#who').textContent = (ME.admin ? '管理員 ' : '老師 ') + ME.name;
  $('#chpw').style.display = ME.admin ? 'none' : '';
  $('#r-ans-tool').style.display = ME.admin ? '' : 'none';
  loadTeachers();
}
$('#logout').onclick = e => { e.preventDefault(); sessionStorage.clear(); location.reload(); };
const owner = () => ME.admin ? 'admin' : 't' + ME.uid;

/* ── 分頁切換 ── */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
  ({teachers: loadTeachers, explorer: () => loadFs(cwd), books: loadBooks})[b.dataset.v]();
});

/* ── 教師人員 ── */
function chkAcct(user, pw, need) {
  if (!user) fail('請設定登入帳號');
  if (user.toLowerCase() === ADMIN_USER) fail('此帳號名稱不可使用');
  if ((need || pw) && pw.length < 4) fail('密碼至少 4 個字元');
}
async function loadTeachers() {
  const rows = (await all('teachers')).reverse(), A = ME.admin;
  $('#t-form').style.display = A ? '' : 'none';
  $('#t-table').innerHTML = rows.length ? `<table><thead><tr><th>姓名</th><th>職務</th>${A ? '<th>登入帳號</th><th></th>' : ''}</tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.title)}</td>` + (A ? `<td>${esc(r.username || '（尚未設定）')}</td>
    <td><button class="btn" data-e="${r.id}" data-n="${esc(r.name)}" data-t="${esc(r.title)}" data-u="${esc(r.username || '')}">編輯帳號</button>
    <button class="btn danger" data-d="${r.id}">刪除</button></td>` : '') + '</tr>').join('') + '</tbody></table>'
    : '<div class="empty">尚未新增任何教師，請在上方輸入姓名、職務、帳號與密碼。</div>';
}
on('#t-add', 'onclick', async () => {
  if (!ME.admin) fail('只有管理員可以執行此操作');
  const name = $('#t-name').value.trim(), title = $('#t-title').value.trim(), user = $('#t-user').value.trim(), pw = $('#t-pass').value;
  if (!name || !title) fail('請輸入姓名與職務');
  chkAcct(user, pw, true);
  if ((await all('teachers')).some(t => t.username === user)) fail('這個帳號已經有人使用');
  await put('teachers', {name, title, username: user, pw: await H(pw), created: now()});
  ['#t-name', '#t-title', '#t-user', '#t-pass'].forEach(x => $(x).value = ''); $('#t-name').focus(); loadTeachers();
});
on('#t-table', 'onclick', async e => {
  const d = e.target.dataset;
  if (d.d && confirm('確定刪除這位教師？他的帳號也會一併刪除。')) {
    await del('teachers', +d.d);
    for (const k of await tx('ann', 'readonly', s => s.getAllKeys())) if (k.split('|')[0] === 't' + d.d) await del('ann', k);
    loadTeachers();
  }
  if (d.e) {
    const n = prompt('姓名', d.n); if (n === null) return;
    const t = prompt('職務', d.t); if (t === null) return;
    const u = prompt('登入帳號', d.u); if (u === null) return;
    const p = prompt('新密碼（不想改請留空）', ''); if (p === null) return;
    if (!n.trim() || !t.trim()) fail('請輸入姓名與職務');
    chkAcct(u.trim(), p, false);
    const row = await get('teachers', +d.e); if (!row) fail('找不到此教師');
    if ((await all('teachers')).some(x => x.username === u.trim() && x.id !== row.id)) fail('這個帳號已經有人使用');
