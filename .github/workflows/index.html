<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>達爾西中學校務系統</title>
<style>
:root{--ink:#0f3d4c;--ink2:#165468;--paper:#f3f6f7;--line:#cfd9dd;--amber:#e0a030;--sel:#cfe6ee;--txt:#1d2b30}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--txt);background:var(--paper);display:flex;flex-direction:column;font-size:15px}
button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #7fb7c7;outline-offset:1px}
body:not(.in) header,body:not(.in) main{display:none}
body.in #login{display:none}
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:50}
#lf{background:var(--paper);width:min(380px,92vw);padding:36px 32px;border-radius:6px;border-top:6px solid var(--amber)}
#lf h1{margin:0 0 4px;font-size:24px;color:var(--ink);letter-spacing:.08em}
#lf p{margin:0 0 24px;color:#52666d;font-size:14px}
#lf label{display:block;font-size:14px;margin:14px 0 6px;color:var(--ink)}
#lf input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;font-size:16px;background:#fff}
#lf button{margin-top:24px;width:100%;padding:12px;border:0;border-radius:4px;background:var(--ink);color:#fff;font-size:16px}
#lf button:hover{background:#0b2f3b}
#err{color:#b3261e;font-size:14px;margin-top:14px}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:20px;padding:0 20px;height:56px;flex:none}
header h1{font-size:19px;margin:0;letter-spacing:.1em;font-weight:600}
nav{display:flex;height:100%;gap:2px;margin-left:12px}
nav button{background:none;border:0;color:#bcd3db;padding:0 18px;height:100%;border-bottom:4px solid transparent}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--amber)}
header .sp{flex:1}
header a{color:#bcd3db;text-decoration:none;font-size:14px}
header a:hover{color:#fff}
main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-width:0;min-height:0}
.view.on{display:flex}
.btn{background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 14px;color:var(--txt)}
.btn:hover{background:#e7f0f3}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:var(--ink2)}
.btn.danger{color:#b3261e}
.btn:disabled{opacity:.4;cursor:default}
#v-teachers,#v-books{flex-direction:column;padding:28px 36px;overflow:auto}
h2{margin:0 0 16px;font-size:20px;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.row input{padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;min-width:180px}
table{border-collapse:collapse;background:#fff;width:100%;max-width:820px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{background:#e7eef1;font-weight:600;color:var(--ink)}
.empty{color:#6b7f86;padding:28px 0}
#v-explorer{flex-direction:column;background:#fff}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{flex:1;min-width:200px;display:flex;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 8px;gap:2px}
.crumb button{background:none;border:0;padding:3px 6px;border-radius:3px}
.crumb button:hover{background:var(--sel)}
.crumb span{color:#8aa0a8}
.split{flex:1;min-height:0;display:flex}
#tree{width:240px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px 4px;background:#f8fafb}
.tn{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn:hover{background:#e7f0f3}.tn.on{background:var(--sel)}
#list{flex:1;overflow:auto}
#list table{max-width:none}
#list tr{cursor:default;user-select:none}
#list tbody tr:hover{background:#eef5f8}
#list tbody tr.sel{background:var(--sel)}
#list td{padding:7px 14px}
.status{padding:5px 14px;border-top:1px solid var(--line);background:var(--paper);font-size:13px;color:#52666d}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;max-width:1000px}
.book{background:#fff;border:1px solid var(--line);border-left:10px solid var(--ink);border-radius:3px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.book b{font-size:16px;line-height:1.4;word-break:break-all}
.book small{color:#6b7f86}
.book .acts{margin-top:auto;display:flex;gap:6px}
#reader{position:fixed;inset:0;background:#2b3a40;display:none;flex-direction:column;z-index:20}
#reader.on{display:flex}
.rbar{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--ink);color:#fff;flex-wrap:wrap}
.rbar .btn{padding:5px 12px}
.rbar .btn.act{background:var(--amber);border-color:var(--amber);color:#1d2b30}
.rbar input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);background:#fff}
.rbar .sep{width:1px;height:24px;background:#4b6b78;margin:0 4px}
.rt{font-weight:600;margin-right:8px;max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scroll{flex:1;overflow:auto;padding:24px}
#sheet{position:relative;margin:0 auto;width:max-content;background:#fff;box-shadow:0 2px 14px #0008}
#sheet canvas{display:block}
#ink{position:absolute;left:0;top:0;touch-action:none}
#ink.pen{cursor:crosshair}
</style></head><body>

<div id="login"><form id="lf">
<h1>達爾西中學</h1><p>校務系統・教職員登入</p>
<label for="u">帳號</label><input id="u" autocomplete="username" required autofocus>
<label for="p">密碼</label><input id="p" type="password" autocomplete="current-password" required>
<div id="err"></div><button>登入</button>
</form></div>

<header>
  <h1>達爾西中學校務系統</h1>
  <nav>
    <button data-v="teachers" class="on">教師人員</button>
    <button data-v="explorer">教務系統</button>
    <button data-v="books">電子書</button>
  </nav>
  <span class="sp"></span>
  <span id="who"></span><a href="#" id="chpw">修改密碼</a><a href="#" id="logout">登出</a>
</header>
<main>
  <section class="view on" id="v-teachers">
    <h2>教師人員管理</h2>
    <div class="row" id="t-form">
      <input id="t-name" placeholder="姓名" aria-label="姓名">
      <input id="t-title" list="titles" placeholder="職務（例：教務主任）" aria-label="職務">
      <datalist id="titles"><option>校長<option>副校長<option>教務主任<option>學務主任<option>總務主任<option>輔導主任<option>導師<option>科任教師</datalist>
      <input id="t-user" placeholder="登入帳號" autocomplete="off" aria-label="登入帳號">
      <input id="t-pass" placeholder="登入密碼" autocomplete="off" aria-label="登入密碼">
      <button class="btn pri" id="t-add">新增教師</button>
    </div>
    <div id="t-table"></div>
  </section>

  <section class="view" id="v-explorer">
    <div class="bar">
      <button class="btn" id="f-up" title="上一層">↑ 上一層</button>
      <div class="crumb" id="crumb"></div>
      <button class="btn" id="f-new">新增資料夾</button>
      <button class="btn" id="f-up-file">上傳檔案</button>
      <button class="btn" id="f-ren" disabled>重新命名</button>
      <button class="btn danger" id="f-del" disabled>刪除</button>
      <input type="file" id="f-input" multiple hidden>
    </div>
    <div class="split"><div id="tree"></div><div id="list"></div></div>
    <div class="status" id="status"></div>
  </section>

  <section class="view" id="v-books">
    <h2>電子書管理</h2>
    <div class="row" id="b-form">
      <input id="b-title" placeholder="書名（可留空）" aria-label="書名">
      <input type="file" id="b-file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif" aria-label="選擇電子書檔案">
      <button class="btn pri" id="b-add">新增電子書</button>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>
</main>

<div id="reader" role="dialog" aria-label="電子書閱讀器">
  <div class="rbar">
    <span class="rt" id="r-title"></span>
    <button class="btn" id="r-prev">◀ 上一頁</button>
    <span id="r-page">1 / 1</span>
    <button class="btn" id="r-next">下一頁 ▶</button>
    <span class="sep"></span>
    <button class="btn" id="r-zout" title="縮小 (-)">－ 縮小</button>
    <span id="r-zoom">100%</span>
    <button class="btn" id="r-zin" title="放大 (+)">＋ 放大</button>
    <span class="sep"></span>
    <button class="btn act" id="r-pen">✏ 畫筆</button>
    <button class="btn" id="r-eraser">橡皮擦</button>
    <input type="color" id="r-color" value="#d93025" title="筆色" aria-label="筆色">
    <select id="r-size" aria-label="筆粗細" class="btn"><option value="2">細</option><option value="4" selected>中</option><option value="8">粗</option></select>
    <button class="btn" id="r-undo">復原</button>
    <button class="btn" id="r-clear">清除本頁筆跡</button>
    <span style="flex:1"></span>
    <button class="btn" id="r-close">關閉</button>
  </div>
  <div id="scroll"><div id="sheet"><canvas id="page"></canvas><canvas id="ink"></canvas></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fail = m => { throw new Error(m); };
const on = (sel, ev, fn) => $(sel)[ev] = async e => { try { await fn(e); } catch (x) { if (x && x.message) alert(x.message); } };
const now = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

/* ── 資料層：IndexedDB（資料存在這部電腦的瀏覽器內） ── */
const ADMIN_USER = 'admin', ADMIN_HASH = 'df316e893315157c636a57f457e7f0daf8a78f443ec4a773f853ec7e93bce779';
const H = async s => {
  if (!window.crypto || !crypto.subtle) fail('此瀏覽器不支援加密功能，請改用 Chrome、Edge 或 Firefox 開啟。');
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('darcy:' + s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
};
let idb;
const openDb = () => new Promise((ok, no) => {
  const r = indexedDB.open('darcy-school', 1);
  r.onupgradeneeded = () => { const d = r.result; ['teachers', 'nodes', 'books'].forEach(n => d.createObjectStore(n, {keyPath: 'id', autoIncrement: true})); d.createObjectStore('ann'); };
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
const tx = (s, m, f) => new Promise((ok, no) => { const t = idb.transaction(s, m), q = f(t.objectStore(s)); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); });
const all = s => tx(s, 'readonly', st => st.getAll());
const get = (s, k) => tx(s, 'readonly', st => st.get(k));
const put = (s, v, k) => tx(s, 'readwrite', st => st.put(v, k));
const del = (s, k) => tx(s, 'readwrite', st => st.delete(k));

let ME = {}, cwd = null, sel = null, items = [], NS = [];

/* ── 登入 ── */
$('#lf').onsubmit = async e => {
  e.preventDefault();
  try {
    const u = $('#u').value.trim(), p = await H($('#p').value); let s = null;
    if (u === ADMIN_USER && p === ADMIN_HASH) s = {role: 'admin', name: '管理員'};
    else { const t = (await all('teachers')).find(x => x.username === u); if (t && t.pw === p) s = {role: 'teacher', uid: t.id, name: t.name}; }
    if (!s) { $('#err').textContent = '帳號或密碼錯誤，請再試一次。'; return; }
    sessionStorage.s = JSON.stringify(s); start(s);
  } catch (x) { $('#err').textContent = x.message || '登入失敗'; }
};
function start(s) {
  ME = {admin: s.role === 'admin', name: s.name, uid: s.uid};
  document.body.classList.add('in');
  $('#who').textContent = (ME.admin ? '管理員　' : '老師　') + ME.name;
  $('#chpw').style.display = ME.admin ? 'none' : '';
  loadTeachers();
}
$('#logout').onclick = e => { e.preventDefault(); sessionStorage.clear(); location.reload(); };
const owner = () => ME.admin ? 'admin' : 't' + ME.uid;

/* ── 分頁切換 ── */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
  ({teachers: loadTeachers, explorer: () => loadFs(cwd), books: loadBooks})[b.dataset.v]();
});

/* ── 教師人員 ── */
function chkAcct(user, pw, need) {
  if (!user) fail('請設定登入帳號');
  if (user.toLowerCase() === ADMIN_USER) fail('此帳號名稱不可使用');
  if ((need || pw) && pw.length < 4) fail('密碼至少 4 個字元');
}
async function loadTeachers() {
  const rows = (await all('teachers')).reverse(), A = ME.admin;
  $('#t-form').style.display = A ? '' : 'none';
  $('#t-table').innerHTML = rows.length ? `<table><thead><tr><th>姓名</th><th>職務</th>${A ? '<th>登入帳號</th><th></th>' : ''}</tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.title)}</td>` + (A ? `<td>${esc(r.username || '（尚未設定）')}</td>
    <td><button class="btn" data-e="${r.id}" data-n="${esc(r.name)}" data-t="${esc(r.title)}" data-u="${esc(r.username || '')}">編輯帳號</button>
    <button class="btn danger" data-d="${r.id}">刪除</button></td>` : '') + '</tr>').join('') + '</tbody></table>'
    : '<div class="empty">尚未新增任何教師，請在上方輸入姓名、職務、帳號與密碼。</div>';
}
on('#t-add', 'onclick', async () => {
  if (!ME.admin) fail('只有管理員可以執行此操作');
  const name = $('#t-name').value.trim(), title = $('#t-title').value.trim(), user = $('#t-user').value.trim(), pw = $('#t-pass').value;
  if (!name || !title) fail('請輸入姓名與職務');
  chkAcct(user, pw, true);
  if ((await all('teachers')).some(t => t.username === user)) fail('這個帳號已經有人使用');
  await put('teachers', {name, title, username: user, pw: await H(pw), created: now()});
  ['#t-name', '#t-title', '#t-user', '#t-pass'].forEach(x => $(x).value = ''); $('#t-name').focus(); loadTeachers();
});
on('#t-table', 'onclick', async e => {
  const d = e.target.dataset;
  if (d.d && confirm('確定刪除這位教師？他的帳號也會一併刪除。')) {
    await del('teachers', +d.d);
    for (const k of await tx('ann', 'readonly', s => s.getAllKeys())) if (k.split('|')[0] === 't' + d.d) await del('ann', k);
    loadTeachers();
  }
  if (d.e) {
    const n = prompt('姓名', d.n); if (n === null) return;
    const t = prompt('職務', d.t); if (t === null) return;
    const u = prompt('登入帳號', d.u); if (u === null) return;
    const p = prompt('新密碼（不想改請留空）', ''); if (p === null) return;
    if (!n.trim() || !t.trim()) fail('請輸入姓名與職務');
    chkAcct(u.trim(), p, false);
    const row = await get('teachers', +d.e); if (!row) fail('找不到此教師');
    if ((await all('teachers')).some(x => x.username === u.trim() && x.id !== row.id)) fail('這個帳號已經有人使用');
    Object.assign(row, {name: n.trim(), title: t.trim(), username: u.trim()});
    if (p) row.pw = await H(p);
    await put('teachers', row); loadTeachers();
  }
});
on('#chpw', 'onclick', async e => {
  e.preventDefault();
  const o = prompt('請輸入目前的密碼'); if (o === null) return;
  const n = prompt('請輸入新密碼（至少 4 個字元）'); if (!n) return;
  const t = await get('teachers', ME.uid);
  if (!t || t.pw !== await H(o)) fail('目前的密碼不正確');
  if (n.length < 4) fail('新密碼至少 4 個字元');
  t.pw = await H(n); await put('teachers', t); alert('密碼已更新');
});

/* ── 教務系統（檔案總管） ── */
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const ftype = it => it.folder ? '檔案資料夾' : ((it.name.split('.').pop() || '').toUpperCase() + ' 檔案');
const byName = (a, b) => a.name.localeCompare(b.name, 'zh');
async function loadFs(pid) {
  cwd = pid || null; sel = null; NS = await all('nodes');
  items = NS.filter(n => (n.parent || null) === cwd).sort((a, b) => b.folder - a.folder || byName(a, b));
  const path = []; let c = cwd;
  while (c) { const r = NS.find(n => n.id === c); if (!r) break; path.unshift(r); c = r.parent || null; }
  const parts = [{id: null, name: '教務系統'}, ...path];
  $('#crumb').innerHTML = parts.map((p, i) => (i ? '<span>›</span>' : '') + `<button data-go="${p.id ?? ''}">${esc(p.name)}</button>`).join('');
  $('#f-up').disabled = !cwd; $('#f-up').dataset.parent = path.length > 1 ? path[path.length - 2].id : '';
  $('#list').innerHTML = items.length ? `<table><thead><tr><th>名稱</th><th>修改日期</th><th>類型</th><th>大小</th></tr></thead><tbody>` +
    items.map(it => `<tr data-id="${it.id}"><td>${it.folder ? '📁' : '📄'} ${esc(it.name)}</td><td>${esc(it.created || '')}</td><td>${ftype(it)}</td><td>${it.folder ? '' : fmtSize(it.size)}</td></tr>`).join('') + '</tbody></table>'
    : '<div class="empty" style="padding:28px">此資料夾是空的。使用「新增資料夾」或「上傳檔案」開始整理。</div>';
  const folders = NS.filter(n => n.folder).sort(byName);
  const draw = (p, depth) => folders.filter(t => (t.parent || null) === p).map(t => `<button class="tn ${t.id === cwd ? 'on' : ''}" style="padding-left:${8 + depth * 16}px" data-go="${t.id}">📁 ${esc(t.name)}</button>` + draw(t.id, depth + 1)).join('');
  $('#tree').innerHTML = `<button class="tn ${cwd ? '' : 'on'}" data-go="">🖥 教務系統</button>` + draw(null, 1);
  updateSel();
}
function updateSel() {
  document.querySelectorAll('#list tbody tr').forEach(r => r.classList.toggle('sel', +r.dataset.id === sel));
  $('#f-ren').disabled = $('#f-del').disabled = !sel;
  $('#f-ren').style.display = $('#f-del').style.display = ME.admin ? '' : 'none';
  $('#status').textContent = items.length + ' 個項目' + (sel ? '　已選取 1 個項目' : '');
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g && (g.closest('#crumb') || g.closest('#tree'))) loadFs(g.dataset.go ? +g.dataset.go : null);
});
$('#f-up').onclick = e => loadFs(e.currentTarget.dataset.parent ? +e.currentTarget.dataset.parent : null);
$('#list').onclick = e => { const r = e.target.closest('tbody tr'); sel = r ? +r.dataset.id : null; updateSel(); };
$('#list').ondblclick = e => {
  const r = e.target.closest('tbody tr'); if (!r) return;
  const it = items.find(x => x.id === +r.dataset.id);
  if (it.folder) loadFs(it.id); else window.open(URL.createObjectURL(it.blob), '_blank');
};
on('#f-new', 'onclick', async () => {
  const n = (prompt('新資料夾名稱', '新增資料夾') || '').trim(); if (!n) return;
  await put('nodes', {parent: cwd, name: n, folder: 1, size: 0, created: now()}); loadFs(cwd);
});
$('#f-up-file').onclick = () => $('#f-input').click();
on('#f-input', 'onchange', async e => {
  for (const f of e.target.files) await put('nodes', {parent: cwd, name: f.name, folder: 0, blob: f, size: f.size, created: now()});
  e.target.value = ''; loadFs(cwd);
});
on('#f-ren', 'onclick', async () => {
  const it = items.find(x => x.id === sel), n = (prompt('重新命名', it.name) || '').trim(); if (!n) return;
  it.name = n; await put('nodes', it); loadFs(cwd);
});
on('#f-del', 'onclick', async () => {
  const it = items.find(x => x.id === sel);
  if (!confirm(`確定刪除「${it.name}」？${it.folder ? '資料夾內所有檔案也會一併刪除。' : ''}`)) return;
  const ids = [sel]; for (let i = 0; i < ids.length; i++) NS.forEach(n => n.parent === ids[i] && ids.push(n.id));
  for (const i of ids) await del('nodes', i);
  loadFs(cwd);
});
document.addEventListener('keydown', e => {
  if ($('#v-explorer').classList.contains('on') && !$('#reader').classList.contains('on') && ME.admin) {
    if (e.key === 'Delete' && sel) $('#f-del').click();
    if (e.key === 'F2' && sel) $('#f-ren').click();
  }
});

/* ── 電子書書架 ── */
async function loadBooks() {
  const rows = (await all('books')).reverse();
  $('#b-form').style.display = ME.admin ? '' : 'none';
  $('#shelf').innerHTML = rows.length ? rows.map(b => `<div class="book"><b>${esc(b.title)}</b>
    <small>${b.kind === 'pdf' ? 'PDF' : '圖片'}・${esc(b.created || '')}</small>
    <div class="acts"><button class="btn pri" data-o="${b.id}">閱讀</button>
    ${ME.admin ? `<button class="btn danger" data-x="${b.id}">刪除</button>` : ''}</div></div>`).join('')
    : `<div class="empty">書架是空的。${ME.admin ? '選擇 PDF 或圖片檔後按「新增電子書」。' : '請等管理員新增電子書。'}</div>`;
}
on('#b-add', 'onclick', async () => {
  const f = $('#b-file').files[0]; if (!f) fail('請先選擇檔案');
  const ext = (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
  const kind = ext === '.pdf' ? 'pdf' : ['.png', '.jpg', '.jpeg', '.webp', '.gif'].includes(ext) ? 'image' : fail('電子書僅支援 PDF 或圖片檔');
  await put('books', {title: $('#b-title').value.trim() || f.name.replace(/\.[^.]+$/, ''), kind, blob: f, created: now()});
  $('#b-file').value = ''; $('#b-title').value = ''; loadBooks();
});
on('#shelf', 'onclick', async e => {
  const d = e.target.dataset;
  if (d.x && confirm('確定刪除這本電子書？筆跡也會一併刪除。')) {
    await del('books', +d.x);
    for (const k of await tx('ann', 'readonly', s => s.getAllKeys())) if (k.split('|')[1] === d.x) await del('ann', k);
    loadBooks();
  }
  if (d.o) openReader(+d.o);
});

/* ── 閱讀器：翻頁、放大縮小、畫筆 ── */
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const R = {id: 0, kind: '', pdf: null, img: null, page: 1, total: 1, scale: 1.3, strokes: [], tool: 'pen', drawing: null, task: null};
const pageCv = $('#page'), ink = $('#ink'), ictx = ink.getContext('2d');

async function openReader(id) {
  const b = await get('books', id); if (!b) return;
  if (b.kind === 'pdf' && !window.pdfjsLib) fail('無法載入 PDF 閱讀元件（cdnjs），請確認網路連線。');
  Object.assign(R, {id, kind: b.kind, page: 1, scale: 1.3, strokes: []});
  $('#r-title').textContent = b.title; $('#reader').classList.add('on');
  if (b.kind === 'pdf') {
    R.pdf = await pdfjsLib.getDocument({data: new Uint8Array(await b.blob.arrayBuffer())}).promise; R.total = R.pdf.numPages;
  } else {
    R.img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(b.blob); });
    R.total = 1;
  }
  gotoPage(1);
}
const annKey = () => `${owner()}|${R.id}|${R.page}`;
async function gotoPage(n) {
  if (R.strokes.length) await saveInk();
  R.page = Math.min(Math.max(1, n), R.total);
  R.strokes = (await get('ann', annKey())) || [];
  await render();
}
async function render() {
  const dpr = window.devicePixelRatio || 1; let w, h;
  if (R.task) { try { R.task.cancel(); } catch (e) {} }
  if (R.kind === 'pdf') {
    const pg = await R.pdf.getPage(R.page), vp = pg.getViewport({scale: R.scale});
    w = vp.width; h = vp.height;
    pageCv.width = w * dpr; pageCv.height = h * dpr; pageCv.style.width = w + 'px'; pageCv.style.height = h + 'px';
    R.task = pg.render({canvasContext: pageCv.getContext('2d'), viewport: pg.getViewport({scale: R.scale * dpr})});
    try { await R.task.promise; } catch (e) {}
  } else {
    w = 900 * R.scale / 1.3; h = w * R.img.naturalHeight / R.img.naturalWidth;
    pageCv.width = w * dpr; pageCv.height = h * dpr; pageCv.style.width = w + 'px'; pageCv.style.height = h + 'px';
    pageCv.getContext('2d').drawImage(R.img, 0, 0, pageCv.width, pageCv.height);
  }
  ink.width = w * dpr; ink.height = h * dpr; ink.style.width = w + 'px'; ink.style.height = h + 'px';
  R.w = w; R.h = h; R.dpr = dpr; redraw();
  $('#r-page').textContent = `${R.page} / ${R.total}`; $('#r-zoom').textContent = Math.round(R.scale / 1.3 * 100) + '%';
}
function redraw() {
  ictx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0); ictx.clearRect(0, 0, R.w, R.h);
  ictx.lineCap = ictx.lineJoin = 'round';
  for (const s of [...R.strokes, ...(R.drawing ? [R.drawing] : [])]) {
    ictx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ictx.strokeStyle = s.c; ictx.lineWidth = s.w * R.w;
    ictx.beginPath(); s.p.forEach(([x, y], i) => i ? ictx.lineTo(x * R.w, y * R.h) : ictx.moveTo(x * R.w, y * R.h));
    if (s.p.length === 1) ictx.lineTo(s.p[0][0] * R.w + .01, s.p[0][1] * R.h);
    ictx.stroke();
  }
}
const saveInk = () => put('ann', R.strokes, annKey());
const pt = e => { const r = ink.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
ink.onpointerdown = e => {
  ink.setPointerCapture(e.pointerId);
  const eras = R.tool === 'eraser';
  R.drawing = {c: $('#r-color').value, e: eras, w: (eras ? +$('#r-size').value * 4 : +$('#r-size').value) / 900, p: [pt(e)]};
};
ink.onpointermove = e => { if (R.drawing) { R.drawing.p.push(pt(e)); redraw(); } };
ink.onpointerup = ink.onpointercancel = () => {
  if (!R.drawing) return;
  R.strokes.push(R.drawing); R.drawing = null; redraw(); saveInk();
};
function setTool(t) { R.tool = t; $('#r-pen').classList.toggle('act', t === 'pen'); $('#r-eraser').classList.toggle('act', t === 'eraser'); }
$('#r-pen').onclick = () => setTool('pen');
$('#r-eraser').onclick = () => setTool('eraser');
$('#r-undo').onclick = () => { R.strokes.pop(); redraw(); saveInk(); };
$('#r-clear').onclick = () => { if (confirm('清除本頁所有筆跡？')) { R.strokes = []; redraw(); saveInk(); } };
const zoom = f => { R.scale = Math.min(4, Math.max(.4, R.scale * f)); render(); };
$('#r-zin').onclick = () => zoom(1.2); $('#r-zout').onclick = () => zoom(1 / 1.2);
$('#r-prev').onclick = () => gotoPage(R.page - 1); $('#r-next').onclick = () => gotoPage(R.page + 1);
$('#r-close').onclick = async () => { await saveInk(); $('#reader').classList.remove('on'); R.strokes = []; R.pdf = null; };
document.addEventListener('keydown', e => {
  if (!$('#reader').classList.contains('on') || e.target.tagName === 'SELECT') return;
  if (e.key === '+' || e.key === '=') zoom(1.2);
  if (e.key === '-') zoom(1 / 1.2);
  if (e.key === 'ArrowRight' || e.key === 'PageDown') gotoPage(R.page + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') gotoPage(R.page - 1);
  if (e.key === 'Escape') $('#r-close').click();
});
ink.classList.add('pen');

/* ── 啟動 ── */
(async () => {
  try { idb = await openDb(); } catch (e) { $('#err').textContent = '無法開啟瀏覽器儲存空間，請勿使用無痕模式。'; return; }
  try {
    const s = JSON.parse(sessionStorage.s || 'null');
    if (s && (s.role === 'admin' || await get('teachers', s.uid))) start(s);
  } catch (e) { sessionStorage.clear(); }
})();
